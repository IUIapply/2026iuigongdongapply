<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공동교육과정 신청 시스템</title>
  <!-- 아래 URL은 사용자님이 제공해주신 앱스크립트 배포 주소입니다 -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbygO1BfkPO7lPUpwVacoHkHi93Mj9BjlppvI9r9bMY6xbFaThASfWeNgiSfge1s1CxP/exec">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f3f4f6;
    }
    .loader-box {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1e40af;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p { color: #4b5563; font-weight: 500; }
    a { color: #1e40af; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="loader-box">
    <div class="spinner"></div>
    <p>신청 페이지로 이동하고 있습니다...</p>
    <a href="https://script.google.com/macros/s/AKfycbyLOnm71SB66jmrsnFtM8w_PgMgME99cR9Zk7av9o8IrqPjWdAi2Xbx38bVdb-DAXeT4Q/exec">자동으로 이동하지 않으면 여기를 클릭하세요.</a>
  </div>
</body>
</html>
